<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>清单 · 项目分组</title>
<style>
:root{color-scheme:light dark;--page:#eeedf0;--paper:#fff;--ink:#25232b;--muted:#85818e;--line:#eeecf1;--accent:#7e65ad;--soft:#f1edf8;--check:#c5c0cf;--overlay:rgb(20 17 27 / .28)}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:0;background:none;-webkit-tap-highlight-color:transparent}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.app{width:100%;max-width:430px;min-height:100svh;background:var(--paper);margin:auto;padding:28px 24px calc(100px + env(safe-area-inset-bottom));position:relative}.topline{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.02em}.edition{display:flex;align-items:center;gap:7px}.mark{width:13px;height:15px;border:1.5px solid var(--accent);border-radius:2px;position:relative}.mark:after{content:"";position:absolute;top:3px;bottom:3px;left:3px;border-left:1px solid var(--accent)}h1{font-size:34px;letter-spacing:-1.5px;font-weight:650;margin:27px 0 2px}.headline{display:flex;align-items:center;justify-content:space-between}.headline .icon-button{color:var(--accent);margin-top:21px}.subtitle{font-size:13px;color:var(--muted);margin:0}.filters{display:flex;gap:22px;margin:25px 0 16px;border-bottom:1px solid var(--line)}.filter{padding:10px 0 13px;min-height:44px;color:var(--muted);font-size:14px;position:relative}.filter[aria-pressed=true]{color:var(--ink);font-weight:600}.filter[aria-pressed=true]:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--accent);border-radius:3px}.filter span{font-size:11px;margin-left:5px;color:var(--muted)}.group{margin-top:15px}.group-head{width:100%;min-height:52px;display:flex;align-items:center;padding:0;text-align:left;gap:10px}.group-head .name{font-size:15px;font-weight:600}.group-head .number{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);margin-left:auto}.group-head .chevron{width:15px;height:15px;color:var(--muted);transition:transform .15s}.group-head[aria-expanded=false] .chevron{transform:rotate(-90deg)}.group-icon{display:flex;align-items:center;color:var(--accent)}.group-icon svg{width:19px;height:19px}.tasks{list-style:none;padding:0;margin:0 0 9px}.task{display:flex;align-items:center;min-height:65px;gap:1px}.check{width:44px;min-height:48px;display:flex;align-items:center;justify-content:flex-start;padding:0 0 0 1px;flex-shrink:0}.check-circle{width:21px;height:21px;border:1.5px solid var(--check);border-radius:7px;display:flex;align-items:center;justify-content:center}.check-circle svg{width:14px;height:14px;stroke-width:2}.check[aria-pressed=true] .check-circle{background:var(--soft);border-color:transparent;color:var(--accent)}.task-copy{padding:9px 0;text-align:left;min-width:0;flex:1;min-height:48px}.task-title{display:block;font-size:15px;overflow-wrap:anywhere}.task-meta{display:block;margin-top:3px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task.done .task-meta{opacity:.7}.group-empty{font-size:13px;color:var(--muted);margin:5px 0 16px 44px}.separator{height:1px;background:var(--line);margin:16px 0 0}.note{margin:31px 0 0;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11px}.note svg{height:13px;width:13px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);padding:13px 24px calc(20px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.bottom-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.bottom-label svg{width:16px;height:16px;color:var(--accent)}.add{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}.icon-button{width:44px;height:44px;display:grid;place-items:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{width:calc(100% - 40px);max-width:370px;max-height:calc(100svh - 48px);overflow:auto;border:0;border-radius:20px;padding:22px;background:var(--paper);color:var(--ink);box-shadow:0 16px 80px rgb(0 0 0 / .15)}dialog::backdrop{background:var(--overlay);backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialog-head h2{font-size:19px;margin:0;font-weight:600}.dialog-head .icon-button{margin:-8px -8px -8px 0;color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:18px 0 7px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:11px 12px;font-size:16px;min-height:46px}textarea{resize:vertical;min-height:82px}.actions{display:flex;gap:10px;margin-top:23px}.actions button{min-height:46px;flex:1;border-radius:10px;font-size:14px;background:var(--soft);color:var(--accent)}.actions .primary{background:var(--accent);color:#fff}.toast{position:fixed;bottom:108px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;font-size:12px;max-width:calc(100% - 40px);z-index:3;display:none}.toast.visible{display:block}
@media(min-width:600px){.app{margin:32px auto;min-height:calc(100svh - 64px);border-radius:24px;box-shadow:0 6px 36px rgb(30 20 50 / .035)}.bottom{bottom:32px;border-radius:0 0 24px 24px}.toast{bottom:140px}}
@media(max-width:350px){.app{padding-left:20px;padding-right:20px}.bottom{padding-left:20px;padding-right:20px}.filters{gap:20px}}
@media(prefers-color-scheme:dark){:root{--page:#141318;--paper:#1d1b22;--ink:#efedf3;--muted:#a09aa9;--line:#302c38;--accent:#b69adf;--soft:#31283f;--check:#635c70;--overlay:rgb(0 0 0 / .5)}.add,.actions .primary{color:#23182f}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="topline"><span class="edition"><span class="mark" aria-hidden="true"></span>AIO LIFE</span><time datetime="2026-10-25">10 月 25 日 · 周日</time></div>
  <div class="headline"><h1>清单</h1><button class="icon-button" id="collapse-all" aria-label="折叠所有分组"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 9 5-5 5 5M7 15l5 5 5-5"/></svg></button></div>
  <p class="subtitle" id="summary">把事情放回各自的位置</p>
  <nav class="filters" aria-label="任务筛选"><button class="filter" id="pending-filter" aria-pressed="true">未完成<span id="pending-count"></span></button><button class="filter" id="all-filter" aria-pressed="false">全部<span id="all-count"></span></button></nav>
  <div id="groups"></div>
  <p class="note"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><span id="completion-note"></span></p>
</main>
<footer class="bottom"><span class="bottom-label"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 4v16"/></svg>工作、学习，还有生活</span><button id="add-task" class="add" aria-label="新增任务"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></footer>
<dialog id="editor" aria-labelledby="editor-title">
<form id="task-form">
  <div class="dialog-head"><h2 id="editor-title">新任务</h2><button class="icon-button" type="button" id="close-editor" aria-label="关闭"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <label for="task-title">要做什么</label><input id="task-title" name="title" required maxlength="120" autocomplete="off" placeholder="写下一件小事">
  <label for="task-group">放入清单</label><select id="task-group" name="group"><option value="work">工作</option><option value="study">学习</option><option value="life">生活</option></select>
  <label for="task-note">备注（选填）</label><textarea id="task-note" name="note" maxlength="240" placeholder="一个时间，或一个小提醒"></textarea>
  <div class="actions"><button type="button" id="cancel-editor">取消</button><button class="primary" type="submit">保存</button></div>
</form>
</dialog>
<div class="toast" id="toast" role="status"></div><div class="sr-only" id="announcement" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const storageKey = 'aio-task-prototype-project-groups-v1';
  const groupData = [{id:'work',name:'工作',path:'M4 7h16v12H4zM8 7V4h8v3M4 12h16M10 12v2h4v-2'}, {id:'study',name:'学习',path:'M12 5c-3-2-7-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-6-1-9 1zM12 5v15'}, {id:'life',name:'生活',path:'m3 11 9-8 9 8M5 9v11h14V9M9 20v-7h6v7'}];
  const defaults = [
    {id:'t1',title:'整理本周计划',group:'work',note:'给下一周留一点余地',done:false},
    {id:'t2',title:'完善任务管理交互',group:'work',note:'AIO Life · 移动端',done:false},
    {id:'t3',title:'复习架构设计30分钟',group:'study',note:'软件架构 · 质量属性',done:false},
    {id:'t4',title:'买水果',group:'life',note:'苹果、香蕉',done:true},
    {id:'t5',title:'晚上散步',group:'life',note:'晚饭后，走慢一点',done:false}
  ];
  let tasks = defaults.map(task => ({...task}));
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (Array.isArray(saved) && saved.every(t => t && typeof t.id === 'string' && typeof t.title === 'string' && typeof t.note === 'string' && typeof t.done === 'boolean' && groupData.some(g => g.id === t.group))) tasks = saved;
  } catch (_) {}
  let filter = 'pending';
  let editingId = null;
  const collapsed = new Set();
  const groups = document.getElementById('groups');
  const dialog = document.getElementById('editor');
  const form = document.getElementById('task-form');
  const titleInput = document.getElementById('task-title');
  const groupInput = document.getElementById('task-group');
  const noteInput = document.getElementById('task-note');
  let toastTimer;
  const icon = (path,cls='') => `<svg class="${cls}" aria-hidden="true" viewBox="0 0 24 24"><path d="${path}"/></svg>`;
  const escape = text => text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const announce = message => { document.getElementById('announcement').textContent = message; };
  function save() {
    try { localStorage.setItem(storageKey, JSON.stringify(tasks)); }
    catch (_) { notify('当前浏览器无法保存，刷新后将重置'); }
  }
  function notify(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('visible'), 2600);
  }
  function render() {
    const remaining = tasks.filter(t => !t.done).length;
    document.getElementById('pending-count').textContent = remaining;
    document.getElementById('all-count').textContent = tasks.length;
    document.getElementById('summary').textContent = remaining ? `${groupData.length} 份清单，${remaining} 件待办` : '今天的事情，都已妥善完成';
    document.getElementById('completion-note').textContent = `已完成 ${tasks.length - remaining} 件事情`;
    document.getElementById('pending-filter').setAttribute('aria-pressed', String(filter === 'pending'));
    document.getElementById('all-filter').setAttribute('aria-pressed', String(filter === 'all'));
    const allClosed = collapsed.size === groupData.length;
    document.getElementById('collapse-all').setAttribute('aria-label', allClosed ? '展开所有分组' : '折叠所有分组');
    groups.innerHTML = groupData.map((group,index) => {
      const allTasks = tasks.filter(t => t.group === group.id);
      const visible = allTasks.filter(t => filter === 'all' || !t.done);
      const done = allTasks.filter(t => t.done).length;
      return `<section class="group" aria-label="${group.name}"><button class="group-head" data-group="${group.id}" aria-expanded="${!collapsed.has(group.id)}" aria-controls="list-${group.id}"><span class="group-icon">${icon(group.path)}</span><span class="name">${group.name}</span><span class="number" aria-label="已完成 ${done}，共 ${allTasks.length} 项">${done} / ${allTasks.length}</span>${icon('m7 10 5 5 5-5','chevron')}</button><div id="list-${group.id}" ${collapsed.has(group.id)?'hidden':''}><ul class="tasks">${visible.map(task => `<li class="task ${task.done?'done':''}"><button class="check" data-check="${escape(task.id)}" aria-pressed="${task.done}" aria-label="${task.done?'恢复':'完成'}：${escape(task.title)}"><span class="check-circle">${task.done?icon('m5 12 4 4L19 6'):''}</span></button><button class="task-copy" data-edit="${escape(task.id)}" aria-label="编辑：${escape(task.title)}"><span class="task-title">${escape(task.title)}</span>${task.note?`<span class="task-meta">${escape(task.note)}</span>`:''}</button></li>`).join('')}</ul>${visible.length?'':`<p class="group-empty">${allTasks.length?'这一份清单，已全部完成':'还没有任务，留一点空白也很好'}</p>`}</div>${index<groupData.length-1?'<div class="separator"></div>':''}</section>`;
    }).join('');
  }
  function openEditor(task) {
    editingId = task ? task.id : null;
    document.getElementById('editor-title').textContent = task ? '编辑任务' : '新任务';
    titleInput.value = task ? task.title : '';
    titleInput.setCustomValidity('');
    groupInput.value = task ? task.group : 'work';
    noteInput.value = task ? task.note : '';
    dialog.showModal();
    titleInput.focus();
  }
  groups.addEventListener('click', event => {
    const groupButton = event.target.closest('[data-group]');
    if(groupButton){
      const id = groupButton.dataset.group;
      collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
      render(); groups.querySelector(`[data-group="${id}"]`).focus(); return;
    }
    const check = event.target.closest('[data-check]');
    if(check){
      const task = tasks.find(t => t.id === check.dataset.check);
      if(!task) return;
      task.done = !task.done; save(); render();
      announce(`${task.title}已${task.done?'完成':'恢复'}`);
      notify(task.done ? '已完成 · 在“全部”中可恢复' : '已恢复任务');
      const nextControl = Array.from(groups.querySelectorAll('[data-check]')).find(button => button.dataset.check === task.id);
      (nextControl || groups.querySelector(`[data-group="${task.group}"]`)).focus(); return;
    }
    const edit = event.target.closest('[data-edit]');
    if(edit) openEditor(tasks.find(t => t.id === edit.dataset.edit));
  });
  document.getElementById('pending-filter').addEventListener('click', () => {filter='pending'; render();});
  document.getElementById('all-filter').addEventListener('click', () => {filter='all'; render();});
  document.getElementById('collapse-all').addEventListener('click', () => {
    if(collapsed.size === groupData.length) collapsed.clear(); else groupData.forEach(g => collapsed.add(g.id));
    render();
  });
  document.getElementById('add-task').addEventListener('click', () => openEditor(null));
  document.getElementById('close-editor').addEventListener('click', () => dialog.close());
  document.getElementById('cancel-editor').addEventListener('click', () => dialog.close());
  titleInput.addEventListener('input', () => titleInput.setCustomValidity(''));
  form.addEventListener('submit', event => {
    event.preventDefault();
    const title = titleInput.value.trim();
    if(!title){titleInput.setCustomValidity('写下一件要做的事情');titleInput.reportValidity();return;}
    const task = tasks.find(t => t.id === editingId);
    const update = {title, group:groupInput.value, note:noteInput.value.trim()};
    if(task) Object.assign(task, update); else tasks.push({id:`t-${Date.now()}-${Math.random().toString(36).slice(2,8)}`, ...update, done:false});
    collapsed.delete(update.group); save(); render(); dialog.close(); announce(task?'任务已更新':'任务已添加');
  });
  render();
})();
</script>
</body>
</html>
