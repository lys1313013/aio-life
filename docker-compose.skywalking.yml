# 可选叠加配置：docker compose -f docker-compose.yml -f docker-compose.skywalking.yml up -d backend
# 必须使用已内置 Agent 的后端镜像，并先启动 SkyWalking 的外部网络。
services:
  backend:
    environment:
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:-} -javaagent:/opt/skywalking-agent/skywalking-agent.jar"
      SW_AGENT_NAME: "${SW_AGENT_NAME:-aio-life-server}"
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "${SW_AGENT_COLLECTOR_BACKEND_SERVICES:-skywalking-oap:11800}"
      # -1 关闭每三秒采样数量限制，即 100% 采样。
      SW_AGENT_SAMPLE: "-1"
      SW_LOGGING_OUTPUT: CONSOLE
    networks:
      - aio-life
      - skywalking

networks:
  skywalking:
    external: true
    name: "${SKYWALKING_NETWORK:-skywalking_default}"
