<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>日程 · 手机任务管理</title>
<style>
  :root{color-scheme:light dark;--bg:#f8f9f6;--paper:#fffefa;--ink:#263a34;--muted:#76817b;--line:#e5eae4;--accent:#407a66;--wash:#ecf3ed;--white:#fff;--field:#f2f4ef;--backdrop:rgba(18,33,27,.3)}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:0;background:none}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}.app{max-width:430px;min-height:100svh;margin:auto;padding:40px 26px 130px;background:var(--paper);position:relative}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted)}.round-button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}.round-button:hover{background:var(--wash)}h1{font-size:32px;line-height:1.2;font-weight:650;letter-spacing:-1px;margin:5px 0 7px}.date-caption{font-size:13px;color:var(--muted);margin:0}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:28px;padding-bottom:24px;border-bottom:1px solid var(--line)}.day{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;min-height:72px;padding:10px 0;border-radius:20px}.day .weekday{font-size:11px;color:var(--muted)}.day .number{font-size:16px;font-variant-numeric:tabular-nums}.day[aria-pressed="true"]{background:var(--accent);color:var(--white)}.day[aria-pressed="true"] .weekday{color:#e3efe6}.day:hover:not([aria-pressed="true"]){background:var(--wash)}.day.today:not([aria-pressed="true"]) .number{color:var(--accent);font-weight:650}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:27px 0 15px}.section-heading h2{font-size:13px;font-weight:500;margin:0;color:var(--muted)}.section-heading span{font-size:12px;color:var(--muted)}.timeline{list-style:none;padding:0;margin:0}.task{display:grid;grid-template-columns:44px 24px minmax(0,1fr);gap:8px;min-height:104px;position:relative}.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);padding-top:18px}.rail{position:relative;display:flex;justify-content:center;padding-top:20px}.rail:after{position:absolute;top:29px;bottom:-21px;width:1px;background:var(--line);content:""}.task:last-child .rail:after{display:none}.dot{width:7px;height:7px;border:1.5px solid var(--accent);background:var(--paper);border-radius:50%;z-index:1}.task.done .dot{background:var(--accent);opacity:.5}.task-content{display:flex;align-items:flex-start;gap:3px;padding:5px 0 18px;min-width:0}.task.featured .task-content{background:var(--wash);border-radius:14px;padding:5px 3px 16px 11px;margin-left:-11px;margin-bottom:20px}.task-edit{flex:1;min-width:0;text-align:left;padding:9px 0;min-height:56px}.task-title{display:block;font-size:15px;line-height:1.6;font-weight:500;overflow-wrap:anywhere}.task-note{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.5}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task.done .task-note{opacity:.75}.complete{width:44px;height:44px;display:grid;place-items:center;flex:none}.check-ring{width:20px;height:20px;border-radius:50%;border:1.5px solid #a4b7ab;display:grid;place-items:center;color:var(--white)}.check-ring svg{width:13px;height:13px;stroke-width:2.2;visibility:hidden}.complete[aria-pressed="true"] .check-ring{background:var(--accent);border-color:var(--accent)}.complete[aria-pressed="true"] svg{visibility:visible}.unscheduled{list-style:none;margin:0;padding:0}.unscheduled .task{grid-template-columns:24px minmax(0,1fr);gap:8px;min-height:70px}.unscheduled .rail{padding-top:22px}.unscheduled .rail:after{display:none}.unscheduled .dot{border-color:var(--muted);width:5px;height:5px}.unscheduled .task-content{padding-bottom:8px}.empty{color:var(--muted);font-size:14px;padding:32px 0;text-align:center;line-height:1.8}.empty svg{display:block;margin:0 auto 14px;color:var(--accent);width:28px;height:28px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);padding:18px 26px max(22px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(transparent,var(--paper) 24%);pointer-events:none}.bottom>*{pointer-events:auto}.daily-progress{font-size:12px;color:var(--muted);padding-top:12px}.daily-progress strong{color:var(--accent);font-weight:500}.add{width:56px;height:56px;display:grid;place-items:center;background:var(--accent);color:var(--white);border-radius:50%;box-shadow:0 5px 16px #163b2220}.add svg{width:25px;height:25px}.add:hover{filter:brightness(1.08)}dialog{border:0;border-radius:22px;background:var(--paper);color:var(--ink);padding:25px;width:min(360px,calc(100% - 32px));max-height:calc(100svh - 40px);overflow:auto;box-shadow:0 18px 70px #132b2429}dialog::backdrop{background:var(--backdrop);backdrop-filter:blur(3px)}.dialog-heading{display:flex;justify-content:space-between;align-items:center;margin:-6px -10px 18px 0}.dialog-heading h2{font-size:20px;font-weight:600;margin:0}label{display:block;font-size:12px;color:var(--muted);margin:18px 0 7px}input{display:block;min-width:0;width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field);color:var(--ink);font-size:16px}.fields{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}.hint{font-size:11px;line-height:1.5;color:var(--muted);margin:7px 0 0}.save{display:block;width:100%;min-height:48px;margin-top:25px;border-radius:12px;background:var(--accent);color:var(--white)}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.notice{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);max-width:calc(100% - 40px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:13px;z-index:3;white-space:normal;text-align:center}.notice:empty{display:none}@media(min-width:600px){.app{margin:32px auto;min-height:820px;border-radius:28px;box-shadow:0 10px 70px #243c2810}.bottom{bottom:22px;border-radius:0 0 28px 28px}}@media(max-width:350px){.app{padding-left:20px;padding-right:20px}.task{grid-template-columns:38px 18px minmax(0,1fr);gap:6px}.task-title{font-size:14px}.week{gap:0}.day{border-radius:18px}.bottom{padding-left:20px;padding-right:20px}}@media(prefers-color-scheme:dark){:root{--bg:#141b18;--paper:#1c2520;--ink:#e5ece6;--muted:#a3aea5;--line:#334037;--accent:#8fbda4;--wash:#283b30;--white:#17291f;--field:#26322a;--backdrop:rgba(0,0,0,.5)}.day[aria-pressed="true"] .weekday{color:#294c39}.check-ring{border-color:#748d7d}.task.featured .task-note{color:#b2c4b8}.app{box-shadow:none}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="topline"><span class="eyebrow">AIO LIFE</span><button class="round-button" id="todayButton" aria-label="返回今天" title="返回今天"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="4"/><path d="M8 3v4m8-4v4M4 11h16"/><circle cx="12" cy="16" r="1"/></svg></button></div>
    <h1>日程</h1><p class="date-caption" id="dateCaption">10 月 25 日，星期日</p>
  </header>
  <nav class="week" id="week" aria-label="选择日期"></nav>
  <section aria-labelledby="scheduleHeading"><div class="section-heading"><h2 id="scheduleHeading">这一天</h2><span id="scheduleCount"></span></div><ol class="timeline" id="timeline"></ol></section>
  <section id="unscheduledSection" aria-labelledby="unscheduledHeading"><div class="section-heading"><h2 id="unscheduledHeading">待安排</h2><span id="unscheduledCount"></span></div><ul class="unscheduled" id="unscheduled"></ul></section>
  <footer class="bottom"><div class="daily-progress" id="progress" aria-live="polite"></div><button class="add" id="addButton" aria-label="新增任务"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></footer>
</main>
<dialog id="editor" aria-labelledby="editorHeading">
  <form id="taskForm">
    <div class="dialog-heading"><h2 id="editorHeading">添加日程</h2><button type="button" class="round-button" id="closeButton" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <label for="titleInput">任务</label><input id="titleInput" name="title" placeholder="想做点什么？" maxlength="160" required autocomplete="off">
    <div class="fields"><div><label for="dateInput">日期</label><input id="dateInput" name="date" type="date" required></div><div><label for="timeInput">时间</label><input id="timeInput" name="time" type="time"></div></div>
    <p class="hint">时间留空，放入待安排。</p>
    <label for="noteInput">备注</label><input id="noteInput" name="note" maxlength="100" placeholder="可选，如预计 30 分钟" autocomplete="off">
    <button class="save" type="submit">保存</button>
  </form>
</dialog>
<div class="notice" id="notice" role="status"></div>
<script>
(()=>{
  'use strict';
  const today='2026-10-25', key='aio-task-concept-timeline-v1';
  const seeds=[
    {id:'a',date:today,time:'09:00',title:'整理本周计划',note:'生活 · 15 分钟',done:true},
    {id:'b',date:today,time:'10:30',title:'复习架构设计 30 分钟',note:'学习 · 专注一小会儿',done:false},
    {id:'c',date:today,time:'14:00',title:'完善任务管理交互',note:'AIO Life · 60 分钟',done:false},
    {id:'d',date:today,time:'19:00',title:'晚上散步',note:'生活 · 30 分钟',done:false},
    {id:'e',date:today,time:'',title:'买水果',note:'生活',done:false},
    {id:'f',date:'2026-10-24',time:'10:00',title:'整理本周笔记',note:'学习 · 20 分钟',done:true},
    {id:'g',date:'2026-10-26',time:'09:30',title:'确认本周工作安排',note:'工作 · 30 分钟',done:false},
    {id:'h',date:'2026-10-26',time:'',title:'准备周二的分享',note:'工作',done:false}
  ];
  const $=id=>document.getElementById(id);
  let tasks=seeds.map(t=>({...t})),selected=today,editingId=null,noticeTimer;
  try {const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.date==='string'&&typeof t.time==='string'&&typeof t.note==='string'&&typeof t.done==='boolean'))tasks=saved;}catch{}
  function notify(message){$('notice').textContent=message;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').textContent='',2200);}
  function persist(){try{localStorage.setItem(key,JSON.stringify(tasks));}catch{notify('本次修改已保留，关闭页面后可能丢失');}}
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function taskMarkup(task,featured){return `<li class="task ${task.done?'done':''} ${featured?'featured':''}">${task.time?`<span class="time">${escape(task.time)}</span>`:''}<span class="rail" aria-hidden="true"><span class="dot"></span></span><div class="task-content"><button type="button" class="task-edit" data-edit="${escape(task.id)}" aria-label="编辑：${escape(task.title)}"><span class="task-title">${escape(task.title)}</span>${task.note?`<span class="task-note">${escape(task.note)}</span>`:''}</button><button type="button" class="complete" data-complete="${escape(task.id)}" aria-label="${task.done?'撤销完成':'完成'}：${escape(task.title)}" aria-pressed="${task.done}"><span class="check-ring"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 8 3 3 5-6"/></svg></span></button></div></li>`;}
  function render(){
    const date=new Date(selected+'T12:00:00');
    $('dateCaption').textContent=`${date.getMonth()+1} 月 ${date.getDate()} 日，星期${'日一二三四五六'[date.getDay()]}`;
    const start=new Date(date);start.setDate(date.getDate()-3);
    $('week').innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `<button type="button" class="day ${value===today?'today':''}" data-day="${value}" aria-label="${d.getMonth()+1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}" aria-pressed="${value===selected}"><span class="weekday">${'日一二三四五六'[d.getDay()]}</span><span class="number">${d.getDate()}</span></button>`;}).join('');
    const list=tasks.filter(t=>t.date===selected),timed=list.filter(t=>t.time).sort((a,b)=>a.time.localeCompare(b.time)),untimed=list.filter(t=>!t.time),first=timed.find(t=>!t.done);
    $('scheduleCount').textContent=timed.length?`${timed.length} 项`:'';
    $('timeline').innerHTML=timed.length?timed.map(t=>taskMarkup(t,t===first)).join(''):`<li class="empty"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>这一天，还没有安排<br>留一点时间给自己</li>`;
    $('unscheduledSection').hidden=!untimed.length;
    $('unscheduledCount').textContent=`${untimed.length} 项`;
    $('unscheduled').innerHTML=untimed.map(t=>taskMarkup(t,false)).join('');
    const completed=list.filter(t=>t.done).length;
    $('progress').innerHTML=list.length?`<strong>${completed} / ${list.length}</strong> 已完成`:'从一件小事开始';
  }
  function openEditor(id=null){editingId=id;const task=tasks.find(t=>t.id===id);$('editorHeading').textContent=task?'编辑日程':'添加日程';$('titleInput').value=task?.title||'';$('dateInput').value=task?.date||selected;$('timeInput').value=task?.time||'';$('noteInput').value=task?.note||'';$('titleInput').setCustomValidity('');$('editor').showModal();$('titleInput').focus();}
  $('week').addEventListener('click',event=>{const button=event.target.closest('[data-day]');if(button){selected=button.dataset.day;render();$('week').querySelector('[aria-pressed="true"]').focus();}});
  document.querySelector('main').addEventListener('click',event=>{const complete=event.target.closest('[data-complete]'),edit=event.target.closest('[data-edit]');if(complete){const task=tasks.find(t=>t.id===complete.dataset.complete);if(!task)return;task.done=!task.done;persist();render();document.querySelector(`[data-complete="${CSS.escape(task.id)}"]`)?.focus();}else if(edit)openEditor(edit.dataset.edit);});
  $('todayButton').addEventListener('click',()=>{selected=today;render();});
  $('addButton').addEventListener('click',()=>openEditor());
  $('closeButton').addEventListener('click',()=>$('editor').close());
  $('titleInput').addEventListener('input',()=>$('titleInput').setCustomValidity(''));
  $('taskForm').addEventListener('submit',event=>{event.preventDefault();const title=$('titleInput').value.trim();if(!title){$('titleInput').setCustomValidity('请输入任务名称');$('titleInput').reportValidity();return;}const existing=tasks.find(t=>t.id===editingId);const values={title,date:$('dateInput').value,time:$('timeInput').value,note:$('noteInput').value.trim()};if(existing)Object.assign(existing,values);else tasks.push({id:`task-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,done:false,...values});selected=values.date;persist();render();$('editor').close();notify(existing?'日程已更新':'已添加到日程');});
  render();
})();
</script>
</body>
</html>
