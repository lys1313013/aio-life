<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>任务 · 极简看板</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#252a34;--muted:#79808d;--line:#e9ecf1;--accent:#576ce0;--tint:#eef1ff;--column:#f0f2f6;--green:#64917b;--shadow:0 2px 6px #26304c05}
@media(prefers-color-scheme:dark){:root{--bg:#191b20;--paper:#25282f;--ink:#eceef3;--muted:#a0a7b5;--line:#353a44;--accent:#a2afff;--tint:#303750;--column:#20232a;--green:#91b7a2;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;color:inherit;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}button{min-height:44px}header{max-width:1120px;margin:auto;padding:calc(33px + env(safe-area-inset-top)) 28px 0}.eyebrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.06em}.brand{font-size:10px;letter-spacing:.17em}.headline{display:flex;align-items:center;justify-content:space-between;margin-top:12px}h1{font-size:32px;font-weight:600;letter-spacing:-1px;margin:0}.add{width:44px;height:44px;border-radius:50%;color:var(--paper);background:var(--ink);display:grid;place-items:center}.scope{display:flex;gap:23px;margin-top:16px;align-items:center}.scope button{font-size:14px;color:var(--muted);padding:0;position:relative}.scope button[aria-pressed=true]{color:var(--ink);font-weight:600}.scope button[aria-pressed=true]:after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--ink)}.summary{font-size:12px;color:var(--muted);margin-left:auto}.mobile-tabs{display:none}.board{max-width:1120px;margin:27px auto 0;padding:0 28px 40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}.column{min-width:0;background:var(--column);border-radius:16px;padding:0 12px 12px;min-height:490px;transition:background .15s}.column.drag-over{outline:2px dashed var(--accent);outline-offset:-2px}.column-head{display:flex;align-items:center;gap:9px;min-height:65px;padding:0 3px}.column-head h2{font-size:14px;font-weight:600;margin:0}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.column[data-status=doing] .dot{background:var(--accent)}.column[data-status=done] .dot{background:var(--green)}.count{font-size:12px;color:var(--muted);margin-left:2px}.column-add{width:44px;margin-left:auto;color:var(--muted);display:grid;place-items:center}.cards{display:flex;flex-direction:column;gap:10px;min-height:330px}.task{background:var(--paper);border-radius:11px;padding:15px 15px 6px;box-shadow:var(--shadow);min-width:0}.task.dragging{opacity:.45}.task-edit{display:block;width:100%;padding:0;min-height:44px;text-align:left;overflow-wrap:anywhere}.task-title{font-size:15px;line-height:1.6;display:block}.note{display:block;font-size:12px;color:var(--muted);margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.task-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.tag{font-size:11px;color:var(--muted)}.move{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--accent);margin-right:-6px;padding:0 6px;white-space:nowrap}.move svg{width:15px;height:15px}.column[data-status=done] .task-title{color:var(--muted)}.column[data-status=done] .move{color:var(--muted)}.empty{color:var(--muted);text-align:center;font-size:13px;margin:40px 0}.column-foot{font-size:11px;color:var(--muted);padding:18px 4px 3px}.hint{max-width:1120px;padding:0 28px 30px;margin:-10px auto 0;color:var(--muted);font-size:12px}dialog{width:min(390px,calc(100vw - 32px));max-height:calc(100svh - 32px);overflow:auto;border:0;border-radius:18px;padding:23px;background:var(--paper);color:var(--ink);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#0006}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin:-4px -8px 12px 0}.dialog-head h2{font-size:19px;margin:0;font-weight:600}.close{width:44px;font-size:25px;color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:16px 0 7px}input,textarea,select{display:block;width:100%;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);padding:10px 11px;font-size:16px;outline-color:var(--accent)}textarea{resize:vertical;min-height:86px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.save{width:100%;border-radius:10px;margin-top:22px;background:var(--ink);color:var(--paper);font-weight:500}.error{font-size:12px;color:var(--accent)}.toast{position:fixed;z-index:5;bottom:calc(25px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(350px,calc(100% - 40px));background:var(--ink);color:var(--paper);border-radius:12px;padding:3px 9px 3px 17px;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 25px #0002;font-size:13px}.toast:not([hidden]){display:flex}.toast button{color:inherit;padding:0 10px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}[hidden]{display:none!important}
@media(max-width:650px){header{padding:calc(30px + env(safe-area-inset-top)) 24px 0}.brand{font-size:9px}.summary{font-size:11px}.mobile-tabs{display:flex;gap:7px;padding:19px 24px 0}.mobile-tabs button{font-size:12px;color:var(--muted);padding:0 12px;border-radius:9px;min-height:38px;white-space:nowrap}.mobile-tabs button[aria-current=true]{color:var(--accent);background:var(--tint)}.mobile-tabs span{font-size:11px;margin-left:5px}.board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:24px;gap:12px;margin-top:17px;padding:0 24px 24px;align-items:stretch;overscroll-behavior-x:contain;scrollbar-width:none}.board::-webkit-scrollbar{display:none}.column{flex:0 0 83%;scroll-snap-align:start;min-height:460px;padding:0 12px 12px}.column:last-child{margin-right:0}.column-head{min-height:62px}.cards{min-height:330px}.hint{padding:0 24px 30px;margin:0;font-size:11px}.task-title{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
<div class="eyebrow"><span>10 月 25 日 · 星期日</span><span class="brand">AIO LIFE</span></div>
<div class="headline"><h1>任务看板</h1><button class="add" id="add" aria-label="新增任务"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<nav class="scope" aria-label="任务范围"><button data-scope="today" aria-pressed="true">今天</button><button data-scope="all" aria-pressed="false">全部</button><span class="summary" id="summary"></span></nav>
</header>
<nav class="mobile-tabs" aria-label="跳转看板列" id="column-tabs"></nav>
<main class="board" id="board" aria-label="任务看板"></main>
<p class="hint" id="hint">拖动卡片调整状态，也可以点卡片右下角移动。</p>
<p class="sr-only" id="announcement" aria-live="polite"></p>
<div class="toast" id="toast" role="status" hidden><span id="toast-label"></span><button id="undo">撤销</button></div>
<dialog id="editor" aria-labelledby="editor-heading"><form id="task-form">
<div class="dialog-head"><h2 id="editor-heading">新增任务</h2><button class="close" type="button" id="close" aria-label="关闭任务编辑">×</button></div>
<label for="task-title">要做什么</label><input id="task-title" required maxlength="160" autocomplete="off" placeholder="写下一个小行动">
<div class="fields"><div><label for="task-status">状态</label><select id="task-status"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select></div><div><label for="task-date">安排</label><select id="task-date"><option value="2026-10-25">今天</option><option value="2026-10-26">明天</option><option value="">暂不安排</option></select></div></div>
<label for="task-note">备注（选填）</label><textarea id="task-note" maxlength="240" placeholder="一个小步骤，或一个提醒"></textarea><p class="error" id="error" hidden role="alert">请写下任务内容。</p><button class="save" type="submit">保存</button>
</form></dialog>
<script>
(()=>{'use strict';
const KEY='aio-life-concept-05-kanban-v2',OLD_KEY='aio-life-concept-05-v1',TODAY='2026-10-25';
const columns=[{id:'todo',name:'待办',next:'doing',action:'开始',foot:'先收集，再慢慢处理。'},{id:'doing',name:'进行中',next:'done',action:'完成',foot:'少一点同时进行，多一点专注。'},{id:'done',name:'已完成',next:'todo',action:'恢复',foot:'每一个完成，都算数。'}];
const initial=[{id:'k1',title:'整理本周计划',note:'列出下周最重要的三件事',date:TODAY,status:'todo',category:'生活'},{id:'k2',title:'买水果',note:'回家路上',date:TODAY,status:'todo',category:'生活'},{id:'k3',title:'完善任务管理交互',note:'把新增和状态切换做得更轻一点',date:TODAY,status:'doing',category:'AIO Life'},{id:'k4',title:'复习架构设计 30 分钟',note:'架构风格与质量属性',date:TODAY,status:'doing',category:'学习'},{id:'k5',title:'晚上散步',note:'给自己留一点放空的时间',date:TODAY,status:'todo',category:'生活'},{id:'k6',title:'整理工作台',note:'',date:TODAY,status:'done',category:'生活'},{id:'k7',title:'整理项目文档',note:'',date:'2026-10-26',status:'todo',category:'工作'}];
const $=id=>document.getElementById(id);let tasks=initial.map(t=>({...t})),scope='today',activeColumn='todo',editing=null,lastUndo=null,toastTimer,dragId=null,scrollTimer;
const valid=t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.note==='string'&&[TODAY,'2026-10-26',''].includes(t.date)&&columns.some(c=>c.id===t.status);
try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved)&&saved.every(valid))tasks=saved;else{const old=JSON.parse(localStorage.getItem(OLD_KEY));if(Array.isArray(old)&&old.length){const migrated=old.map(t=>({...t,status:t.done?'done':'todo',category:typeof t.category==='string'?t.category:'任务'}));if(migrated.every(valid))tasks=migrated;}}}catch{}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch{announce('修改已保留在当前页面');}}
function announce(text){$('announcement').textContent=text;}
function filtered(){return tasks.filter(t=>scope==='all'||t.date===TODAY);}
function jump(status,behavior='smooth') {activeColumn=status;const el=$('column-'+status);if(innerWidth<=650&&el)$('board').scrollTo({left:el.offsetLeft-$('board').offsetLeft-24,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':behavior});syncTabs();}
function syncTabs(){document.querySelectorAll('[data-column]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.column===activeColumn)));}
function move(id,status){const task=tasks.find(t=>t.id===id);if(!task||task.status===status)return;lastUndo={id,status:task.status};task.status=status;persist();render();$('toast-label').textContent='已移至'+columns.find(c=>c.id===status).name;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500);announce($('toast-label').textContent);}
function card(task){const article=document.createElement('article');article.className='task';article.draggable=true;article.dataset.id=task.id;const edit=document.createElement('button');edit.className='task-edit';edit.setAttribute('aria-label','编辑任务：'+task.title);const title=document.createElement('span');title.className='task-title';title.textContent=task.title;edit.append(title);if(task.note){const note=document.createElement('span');note.className='note';note.textContent=task.note;edit.append(note);}edit.onclick=()=>openEditor(task.id);const footer=document.createElement('div');footer.className='task-footer';const tag=document.createElement('span');tag.className='tag';tag.textContent=[task.category||'任务',scope==='all'?(task.date===TODAY?'今天':task.date?'明天':'未安排'):''].filter(Boolean).join(' · ');const action=document.createElement('button');action.className='move';const col=columns.find(c=>c.id===task.status);action.setAttribute('aria-label',col.action+'任务：'+task.title);action.innerHTML='<span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>';action.firstChild.textContent=col.action;action.onclick=()=>move(task.id,col.next);footer.append(tag,action);article.append(edit,footer);article.addEventListener('dragstart',e=>{dragId=task.id;e.dataTransfer.setData('text/plain',task.id);e.dataTransfer.effectAllowed='move';article.classList.add('dragging');});article.addEventListener('dragend',()=>{dragId=null;article.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(e=>e.classList.remove('drag-over'));});return article;}
function render(){const list=filtered(),done=list.filter(t=>t.status==='done').length;$('summary').textContent=(list.length-done)+' 件待办 · '+done+' 件完成';document.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scope===scope)));const board=$('board');board.replaceChildren();$('column-tabs').replaceChildren();for(const col of columns){const items=list.filter(t=>t.status===col.id);const tab=document.createElement('button');tab.dataset.column=col.id;tab.setAttribute('aria-controls','column-'+col.id);tab.textContent=col.name;const number=document.createElement('span');number.textContent=String(items.length);tab.append(number);tab.onclick=()=>jump(col.id);$('column-tabs').append(tab);const section=document.createElement('section');section.className='column';section.id='column-'+col.id;section.dataset.status=col.id;section.setAttribute('aria-labelledby','heading-'+col.id);const heading=document.createElement('div');heading.className='column-head';heading.innerHTML='<span class="dot" aria-hidden="true"></span><h2 id="heading-'+col.id+'">'+col.name+'</h2><span class="count">'+items.length+'</span><button class="column-add" aria-label="在'+col.name+'中新增任务"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>';heading.lastChild.onclick=()=>openEditor(null,col.id);const cards=document.createElement('div');cards.className='cards';if(items.length)items.forEach(t=>cards.append(card(t)));else{const empty=document.createElement('p');empty.className='empty';empty.textContent=col.id==='done'?'完成的事情会留在这里':'暂时没有任务';cards.append(empty);}const foot=document.createElement('p');foot.className='column-foot';foot.textContent=col.foot;section.append(heading,cards,foot);section.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();e.dataTransfer.dropEffect='move';section.classList.add('drag-over');});section.addEventListener('dragleave',e=>{if(!section.contains(e.relatedTarget))section.classList.remove('drag-over');});section.addEventListener('drop',e=>{e.preventDefault();section.classList.remove('drag-over');const id=dragId;dragId=null;move(id,col.id);});board.append(section);}syncTabs();$('hint').textContent=innerWidth<=650?'左右滑动查看各列 · 点卡片编辑，点右下角推进状态。':'拖动卡片调整状态，也可以点卡片右下角移动。';}
function openEditor(id=null,status=activeColumn){editing=id;const task=tasks.find(t=>t.id===id);$('editor-heading').textContent=task?'编辑任务':'新增任务';$('task-title').value=task?.title||'';$('task-status').value=task?.status||status;$('task-date').value=task?task.date:TODAY;$('task-note').value=task?.note||'';$('error').hidden=true;$('editor').showModal();$('task-title').focus();}
document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;render();});$('add').onclick=()=>openEditor();$('close').onclick=()=>$('editor').close();$('task-title').oninput=()=>$('error').hidden=true;$('task-form').onsubmit=e=>{e.preventDefault();const title=$('task-title').value.trim();if(!title){$('error').hidden=false;return;}const values={title,status:$('task-status').value,date:$('task-date').value,note:$('task-note').value.trim()};const task=tasks.find(t=>t.id===editing);if(task)Object.assign(task,values);else tasks.push({id:'k-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),category:'任务',...values});if(scope==='today'&&values.date!==TODAY)scope='all';persist();render();$('editor').close();jump(values.status);announce('任务已保存');};$('undo').onclick=()=>{if(lastUndo){const t=tasks.find(t=>t.id===lastUndo.id);if(t)t.status=lastUndo.status;persist();render();lastUndo=null;}$('toast').hidden=true;clearTimeout(toastTimer);announce('已撤销移动');};$('board').addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{if(innerWidth>650)return;const board=$('board'),left=board.getBoundingClientRect().left+24;const nearest=[...board.children].sort((a,b)=>Math.abs(a.getBoundingClientRect().left-left)-Math.abs(b.getBoundingClientRect().left-left))[0];if(nearest){activeColumn=nearest.dataset.status;syncTabs();}},80);},{passive:true});addEventListener('resize',()=>{$('hint').textContent=innerWidth<=650?'左右滑动查看各列 · 点卡片编辑，点右下角推进状态。':'拖动卡片调整状态，也可以点卡片右下角移动。';});render();
})();
</script>
</body>
</html>
