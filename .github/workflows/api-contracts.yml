name: Synchronize cross-repository API contracts

on:
  push:
    branches: [main]
    paths:
      [
        "scripts/generate-api-contracts.py",
        "scripts/sync-api-contracts.py",
        ".github/workflows/api-contracts.yml",
      ]
  pull_request:
    paths:
      [
        "scripts/generate-api-contracts.py",
        "scripts/sync-api-contracts.py",
        ".github/workflows/api-contracts.yml",
      ]
  workflow_dispatch:
  workflow_call:
    secrets:
      CONTRACTS_FRONT_SSH_KEY:
        required: true
      CONTRACTS_MOBILE_SSH_KEY:
        required: true

permissions:
  contents: read

# Finish both client pushes before another synchronization starts.
concurrency:
  group: api-contracts-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout contract generator
        uses: actions/checkout@v6
        with:
          repository: lys1313013/aio-life
          ref: ${{ github.repository == 'lys1313013/aio-life' && github.sha || 'main' }}
      - name: Check synchronization credentials
        if: github.event_name != 'pull_request'
        env:
          FRONT_KEY: ${{ secrets.CONTRACTS_FRONT_SSH_KEY }}
          MOBILE_KEY: ${{ secrets.CONTRACTS_MOBILE_SSH_KEY }}
        run: |
          test -n "$FRONT_KEY" || { echo "::error::Missing CONTRACTS_FRONT_SSH_KEY"; exit 1; }
          test -n "$MOBILE_KEY" || { echo "::error::Missing CONTRACTS_MOBILE_SSH_KEY"; exit 1; }
      - uses: actions/checkout@v6
        with:
          repository: lys1313013/aio-life-server
          ref: main
          path: aio-life-server
      - uses: actions/checkout@v6
        with:
          repository: lys1313013/aio-life-front
          ref: main
          path: aio-life-front
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.CONTRACTS_FRONT_SSH_KEY || '' }}
      - uses: actions/checkout@v6
        with:
          repository: lys1313013/aio-life-mobile
          ref: main
          path: aio-life-mobile
          ssh-key: ${{ github.event_name != 'pull_request' && secrets.CONTRACTS_MOBILE_SSH_KEY || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aio-life-front/package.json
      # Resolve the store in the same packageManager context as pnpm install.
      - name: Resolve frontend pnpm store
        id: pnpm-store
        working-directory: aio-life-front
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ steps.pnpm-store.outputs.version }}-${{ hashFiles('aio-life-front/pnpm-lock.yaml') }}
      - name: Install locked formatter and linter
        if: github.event_name == 'pull_request'
        working-directory: aio-life-front
        env:
          HUSKY: "0"
          LEFTHOOK: "0"
        run: pnpm install --frozen-lockfile
      - name: Generate and push both client contracts
        id: sync
        if: github.event_name != 'pull_request'
        run: python3 scripts/sync-api-contracts.py
      - name: Check contracts after both client pushes
        run: python3 scripts/generate-api-contracts.py --check
