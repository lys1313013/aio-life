name: Cross-repository API contracts

# The local unified delivery entry dispatches this only after all pushes finish.
on:
  workflow_dispatch:
    inputs:
      generator_sha:
        description: Main repository commit containing the generator
        required: true
        type: string
      server_sha:
        description: Pushed backend commit
        required: true
        type: string
      front_sha:
        description: Pushed Web commit
        required: true
        type: string
      mobile_sha:
        description: Pushed mobile commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require immutable commit references
        env:
          GENERATOR_SHA: ${{ inputs.generator_sha }}
          SERVER_SHA: ${{ inputs.server_sha }}
          FRONT_SHA: ${{ inputs.front_sha }}
          MOBILE_SHA: ${{ inputs.mobile_sha }}
        run: |
          for sha in "$GENERATOR_SHA" "$SERVER_SHA" "$FRONT_SHA" "$MOBILE_SHA"; do
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Full commit SHAs are required"; exit 1; }
          done
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.generator_sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: lys1313013/aio-life-server
          ref: ${{ inputs.server_sha }}
          path: aio-life-server
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: lys1313013/aio-life-front
          ref: ${{ inputs.front_sha }}
          path: aio-life-front
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: lys1313013/aio-life-mobile
          ref: ${{ inputs.mobile_sha }}
          path: aio-life-mobile
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: aio-life-front/package.json
      # Resolve the store in the same packageManager context as pnpm install.
      - name: Resolve frontend pnpm store
        id: pnpm-store
        working-directory: aio-life-front
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ steps.pnpm-store.outputs.version }}-${{ hashFiles('aio-life-front/pnpm-lock.yaml') }}
      - name: Install locked formatter and linter
        working-directory: aio-life-front
        env:
          HUSKY: "0"
          LEFTHOOK: "0"
        run: pnpm install --frozen-lockfile
      - name: Check published contracts
        run: python3 scripts/generate-api-contracts.py --check
      - name: Record checked commits
        if: always()
        env:
          GENERATOR_SHA: ${{ inputs.generator_sha }}
          SERVER_SHA: ${{ inputs.server_sha }}
          FRONT_SHA: ${{ inputs.front_sha }}
          MOBILE_SHA: ${{ inputs.mobile_sha }}
        run: |
          printf '| Repository | Commit |\n| --- | --- |\n| generator | %s |\n| server | %s |\n| front | %s |\n| mobile | %s |\n' "$GENERATOR_SHA" "$SERVER_SHA" "$FRONT_SHA" "$MOBILE_SHA" >> "$GITHUB_STEP_SUMMARY"
